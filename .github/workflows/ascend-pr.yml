name: Ascend-PR-CI
run-name: Ascend-PR-CI ${{ github.event.pull_request.number && format('#{0}', github.event.pull_request.number) || github.ref_name }}

# One entry point for PR, nightly and manual scope selection.
#
#   lint -> Planner -> PlannerOutput -> Executor -> Gate
#
# The Plan carries an immutable digest image reference. Image builds and
# alias promotion are a separate release pipeline; they are not a job in this
# graph and cannot change the test topology.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
    inputs:
      mode:
        required: false
        default: 'pr'
        type: string
      target_job:
        required: false
        default: ''
        type: string
      scope:
        description: 'Optional ci.yml scope override'
        required: false
        default: ''
        type: string
      targets:
        description: 'Optional target slice, for example cpu or npu-a3'
        required: false
        default: ''
        type: string
      checkout_ref:
        description: 'Optional Git ref under test; empty uses the event checkout'
        required: false
        default: ''
        type: string
      image_ref:
        description: 'Optional immutable image ref; empty derives content refs'
        required: false
        default: ''
        type: string
      image_id:
        description: 'Logical image ID paired with image_ref'
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      mode:
        description: 'pr = core pytest + two integration guards; full = nightly scope'
        required: true
        default: 'pr'
        type: choice
        options:
          - pr
          - full
      target_job:
        description: 'optional Plan job id(s), comma-separated; empty runs the full mode'
        required: false
        default: ''
        type: string
      image_ref:
        description: 'optional explicit image ref; empty derives the SHA content refs'
        required: false
        default: ''
        type: string
      image_id:
        description: 'logical image ID paired with image_ref'
        required: false
        default: ''
        type: string
      targets:
        description: 'optional target slice, for example cpu or npu-a3'
        required: false
        default: ''
        type: string

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read
  actions: read

env:
  # run_tests.sh treats MODE as cpu/npu, so keep this variable name distinct.
  CI_MODE: ${{ github.event_name == 'pull_request' && 'pr' || inputs.mode }}
  CI_TARGET_JOB: ${{ inputs.target_job || '' }}
  CI_TARGETS: ${{ inputs.targets || '' }}
  CI_SCOPE: ${{ inputs.scope || '' }}
  CI_IMAGE_REF: ${{ inputs.image_ref || '' }}
  CI_IMAGE_ID: ${{ inputs.image_id || '' }}

jobs:
  plan:
    name: Lint-Plan
    runs-on: ${{ vars.CI_CPU_RUNNER || 'ubuntu-22.04-arm' }}
    timeout-minutes: 20
    outputs:
      cpu_jobs: ${{ steps.publish.outputs.cpu_jobs || '[]' }}
      cpu_job_count: ${{ steps.publish.outputs.cpu_job_count || '0' }}
      container_jobs: ${{ steps.publish.outputs.container_jobs || '[]' }}
      container_job_count: ${{ steps.publish.outputs.container_job_count || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout_ref || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: classify changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          CI_SCOPE: ${{ inputs.scope || '' }}
          CI_MODE: ${{ github.event_name == 'pull_request' && 'pr' || inputs.mode }}
        run: |
          set -euo pipefail
          kind=code
          if [ "$EVENT_NAME" = pull_request ] && [ -n "$BASE_SHA" ]; then
            changed="$RUNNER_TEMP/ci-changed-files.txt"
            git diff --name-only --diff-filter=AM --no-renames \
              "$BASE_SHA...HEAD" > "$changed"
            kind=$(python3 -m scripts.ci.tools.changed_files --changed-files "$changed")
          fi
          change_mode=$kind
          if [ -n "$CI_SCOPE" ]; then
            scope=$CI_SCOPE
          elif [ "$CI_MODE" = full ]; then
            scope=nightly
          else
            scope=pull_request
          fi
          printf 'change_mode=%s\nscope=%s\n' "$change_mode" "$scope" >> "$GITHUB_OUTPUT"
          echo "kind=$kind; change mode=$change_mode; plan scope=$scope" >> "$GITHUB_STEP_SUMMARY"

      - name: install CI dependencies
        run: |
          python3 -m pip install --quiet --disable-pip-version-check \
            -r requirements-lint.txt

      - name: lint
        id: lint
        if: steps.changes.outputs.change_mode == 'code'
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -uo pipefail
          python3 -m scripts.ci.tools.lint

      - name: plan
        id: publish
        if: always()
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          CHANGE_MODE: ${{ steps.changes.outputs.change_mode || 'code' }}
          SCOPE: ${{ steps.changes.outputs.scope || 'pull_request' }}
          CI_SOURCE_REF: ${{ inputs.checkout_ref || github.ref }}
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/ci-plan"
          COMMON=(
            --root "$GITHUB_WORKSPACE"
            --scope "$SCOPE"
            --output "$RUNNER_TEMP/ci-plan/plan.json"
            --change-mode "$CHANGE_MODE"
          )
          if [ -n "$CI_TARGET_JOB" ]; then
            COMMON+=(--target-job "$CI_TARGET_JOB")
          fi
          if [ -n "$CI_TARGETS" ]; then
            COMMON+=(--targets "$CI_TARGETS")
          fi
          if [ "$CHANGE_MODE" = code ] && [ -n "$CI_IMAGE_ID" ]; then
            COMMON+=(--image "$CI_IMAGE_ID")
            if [ -n "$CI_IMAGE_REF" ]; then
              COMMON+=(--image-ref "$CI_IMAGE_ID=$CI_IMAGE_REF")
            fi
          fi
          if [ "$CHANGE_MODE" = image_only ] || [ "$CHANGE_MODE" = mixed ]; then
            echo "Dockerfile PR is handled by Ascend-Image-PR" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$CHANGE_MODE" = code ] && \
            [ "$LINT_OUTCOME" != success ]; then
            echo "::error::lint failed"
            exit 1
          fi
          MATRIX_OUTPUT="$RUNNER_TEMP/matrix-output"
          if ! GITHUB_OUTPUT="$MATRIX_OUTPUT" \
            python3 -m scripts.ci.execution.producer.cli plan "${COMMON[@]}"; then
            exit 1
          fi
          echo "Planner matrix outputs:"
          cat "$MATRIX_OUTPUT"
          cat "$MATRIX_OUTPUT" >> "$GITHUB_OUTPUT"

      - name: upload plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-plan
          path: ${{ runner.temp }}/ci-plan
          if-no-files-found: warn
          retention-days: 7

  cpu:
    name: Ascend-PR-CPU (${{ matrix.job_id }})
    needs: plan
    if: |
      always() && needs.plan.result == 'success' &&
      needs.plan.outputs.cpu_job_count != '0'
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.cpu_jobs) }}
    runs-on: ${{ vars[matrix.runner_variable] || matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            scripts/ci/config/ci.yml
            scripts/ci/config/envs/*.txt

      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
          path: ${{ runner.temp }}/ci-plan

      - name: execute
        env:
          RUNNER_LABEL: ${{ vars[matrix.runner_variable] || matrix.runner }}
          CI_VENV_ROOT: ${{ runner.temp }}/turbo-ci-venv
        run: |
          set +e
          result_root="$RUNNER_TEMP/ci-result"
          mkdir -p "$result_root"
          python3 -m scripts.ci.execution.consumer.executor \
            --plan "$RUNNER_TEMP/ci-plan/plan.json" \
            --job-id "${{ matrix.job_id }}" \
            --output "$result_root/job-result.json" \
            --summary "$GITHUB_STEP_SUMMARY"
          rc=$?
          printf '%s\n' "$rc" > "$result_root/executor.exit_code"
          if [ "$rc" -ne 0 ]; then
            echo "::warning::executor exited with code $rc; result upload will still run"
          fi
          exit "$rc"

      - name: verify result
        if: always()
        run: |
          result="$RUNNER_TEMP/ci-result/job-result.json"
          if [ ! -s "$result" ]; then
            echo "::error::executor exited without writing $result"
            exit 1
          fi

      - name: upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-result-${{ matrix.job_id }}
          path: ${{ runner.temp }}/ci-result
          if-no-files-found: warn
          retention-days: 7

      - name: enforce result
        if: always()
        run: |
          set -euo pipefail
          result_root="$RUNNER_TEMP/ci-result"
          result="$result_root/job-result.json"
          if [ ! -s "$result" ]; then
            echo "::error::executor exited without writing $result"
            exit 1
          fi
          status=$(python3 -c \
            'import json,sys; print(json.load(open(sys.argv[1])).get("status", ""))' \
            "$result")
          rc=$(cat "$result_root/executor.exit_code" 2>/dev/null || true)
          rc=${rc:-missing}
          echo "executor exit code: $rc; result status: $status"
          case "$status" in
            passed|skipped) ;;
            *)
              echo "::error::CI job result is $status"
              exit 1
              ;;
          esac
          if [ "$rc" != 0 ]; then
            echo "::error::executor exited with code $rc"
            exit 1
          fi

  container:
    name: Ascend-PR-Container (${{ matrix.job_id }})
    needs: plan
    if: |
      always() && needs.plan.result == 'success' &&
      needs.plan.outputs.container_job_count != '0'
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(vars.CI_CONTAINER_MAX_PARALLEL || '2') }}
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.container_jobs) }}
    runs-on: ${{ vars[matrix.runner_variable] || matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    container:
      image: ${{ matrix.image_ref }}
      options: ${{ matrix.container_options }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
          path: ${{ runner.temp }}/ci-plan

      - name: execute
        env:
          RUNNER_LABEL: ${{ vars[matrix.runner_variable] || matrix.runner }}
          CI_VENV_ROOT: /tmp/turbo-ci-venv
        run: |
          set +e
          result_root="$RUNNER_TEMP/ci-result"
          mkdir -p "$result_root"
          python3 -m scripts.ci.execution.consumer.executor \
            --plan "$RUNNER_TEMP/ci-plan/plan.json" \
            --job-id "${{ matrix.job_id }}" \
            --output "$result_root/job-result.json" \
            --summary "$GITHUB_STEP_SUMMARY"
          rc=$?
          printf '%s\n' "$rc" > "$result_root/executor.exit_code"
          if [ "$rc" -ne 0 ]; then
            echo "::warning::executor exited with code $rc; result upload will still run"
          fi
          exit "$rc"

      - name: verify result
        if: always()
        run: |
          result="$RUNNER_TEMP/ci-result/job-result.json"
          if [ ! -s "$result" ]; then
            echo "::error::executor exited without writing $result"
            exit 1
          fi

      - name: upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-result-${{ matrix.job_id }}
          path: ${{ runner.temp }}/ci-result
          if-no-files-found: warn
          retention-days: 7

      - name: enforce result
        if: always()
        run: |
          set -euo pipefail
          result_root="$RUNNER_TEMP/ci-result"
          result="$result_root/job-result.json"
          if [ ! -s "$result" ]; then
            echo "::error::executor exited without writing $result"
            exit 1
          fi
          status=$(python3 -c \
            'import json,sys; print(json.load(open(sys.argv[1])).get("status", ""))' \
            "$result")
          rc=$(cat "$result_root/executor.exit_code" 2>/dev/null || true)
          rc=${rc:-missing}
          echo "executor exit code: $rc; result status: $status"
          case "$status" in
            passed|skipped) ;;
            *)
              echo "::error::CI job result is $status"
              exit 1
              ;;
          esac
          if [ "$rc" != 0 ]; then
            echo "::error::executor exited with code $rc"
            exit 1
          fi

  gate:
    name: Ascend-PR-Gate
    needs: [plan, cpu, container]
    if: ${{ always() }}
    runs-on: ${{ vars.CI_CPU_RUNNER || 'ubuntu-22.04-arm' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: download plan
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ci-plan
          path: ${{ runner.temp }}/ci-plan

      - name: download results
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: ci-result-*
          path: ${{ runner.temp }}/ci-results

      - name: timing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -m scripts.ci.execution.finalization.timing

      - name: judge
        env:
          PLAN: ${{ runner.temp }}/ci-plan/plan.json
          RESULTS: ${{ runner.temp }}/ci-results
          DECISION: ${{ runner.temp }}/ci-decision/decision.json
        run: |
          set -uo pipefail
          mkdir -p "$RESULTS" "$(dirname "$DECISION")"
          if [ ! -f "$PLAN" ]; then
            echo "::error::missing ci-plan artifact"
            printf '## CI Gate: failed\n\n- missing-plan: ci-plan artifact is missing\n' \
              >> "$GITHUB_STEP_SUMMARY"
            exit 2
          fi
          python3 -m scripts.ci.execution.finalization.gate \
            --plan "$PLAN" \
            --results "$RESULTS" \
            --output "$DECISION" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: upload decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-decision
          path: ${{ runner.temp }}/ci-decision
          if-no-files-found: ignore
          retention-days: 7
