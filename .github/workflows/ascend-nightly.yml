name: Ascend-Nightly-CI
run-name: Ascend-Nightly-CI ${{ github.ref_name }}

# Full pytest + integration run on the current content-tag image. Reuses the
# main CI graph in ascend-pr.yml and never builds or promotes an image.
# Automatic scheduling is intentionally disabled for now.
on:
  # schedule:
  #   - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  nightly:
    name: Ascend-Nightly-Full
    uses: ./.github/workflows/ascend-pr.yml
    with:
      mode: full
