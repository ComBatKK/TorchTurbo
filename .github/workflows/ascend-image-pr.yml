name: Ascend Image PR
run-name: Image PR ${{ format('#{0}', github.event.pull_request.number) }}

# Dockerfile PR validation. One Plan job does lint, change routing, image
# identity planning and CPU test planning:
#   Plan -> CPU matrix -> per-image build -> NPU tests -> Gate
#
# A mixed Dockerfile + code PR runs the CPU matrix before any build. Different
# images remain independent reusable pipelines.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    branches: [main, ci/pr-replay-baseline]
    paths:
      - 'docker/**/Dockerfile*'

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: image-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: Image plan
    runs-on: ${{ vars.CI_CPU_RUNNER || 'ubuntu-22.04-arm' }}
    timeout-minutes: 20
    outputs:
      change_route: ${{ steps.plan.outputs.change_route }}
      cpu_jobs: ${{ steps.plan.outputs.cpu_jobs }}
      cpu_job_count: ${{ steps.plan.outputs.cpu_job_count }}
      image_jobs: ${{ steps.plan.outputs.image_jobs }}
      image_count: ${{ steps.plan.outputs.image_count }}
      images: ${{ steps.plan.outputs.images }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install CI dependencies
        run: python3 -m pip install --quiet --disable-pip-version-check -r requirements-lint.txt

      - name: lint
        run: python3 -m scripts.ci.tools.lint

      - name: Fork PR approval
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'image-ci/run') }}
        run: |
          set -euo pipefail
          if [ "$HEAD_REPOSITORY" = "$BASE_REPOSITORY" ]; then
            echo "same-repository PR; approval not required"
            exit 0
          fi
          if [ "$HAS_LABEL" = true ]; then
            echo "fork PR approved by image-ci/run"
            exit 0
          fi
          echo "::error::fork image PR requires maintainer approval via the 'image-ci/run' label"
          exit 1

      - name: Route and plan
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          echo "Stage 1: collect changed files"
          changed="$RUNNER_TEMP/ci-changed-files.txt"
          git diff --name-only --no-renames "$BASE_SHA...HEAD" > "$changed"

          echo "Stage 2: classify non-image changes"
          route=$(python3 -m scripts.ci.routing.change_router --changed-files "$changed")
          route=${route#change_route=}
          case "$route" in
            code|image_only|mixed) ;;
            *) echo "::error::expected code, image_only or mixed; got $route"; exit 1 ;;
          esac

          echo "Stage 3: select affected images from changed Dockerfiles"
          matrix="$RUNNER_TEMP/image-matrix.json"
          python3 -m scripts.ci.image plan \
            --root "$GITHUB_WORKSPACE" --changed-files "$changed" \
            --output "$matrix" --github-output "$GITHUB_OUTPUT"

          image_count=$(sed -n 's/^image_count=//p' "$GITHUB_OUTPUT" | tail -n 1)
          if [ "${image_count:-0}" -eq 0 ]; then
            effective_route=no_image
          elif [ "$route" = mixed ]; then
            effective_route=mixed
          else
            effective_route=image_only
          fi

          echo "Stage 4: generate the CPU plan for mixed image PRs only"
          if [ "$effective_route" = mixed ]; then
            python3 -m scripts.ci.execution.producer.planner \
              --scope pull_request --change-scope code --targets cpu \
              --output "$RUNNER_TEMP/ci-plan/plan.json" --github-output "$GITHUB_OUTPUT"
          else
            printf 'cpu_jobs=[]\ncpu_job_count=0\n' >> "$GITHUB_OUTPUT"
          fi

          echo "Stage 5: publish step outputs and summary"
          printf 'change_route=%s\n' "$effective_route" >> "$GITHUB_OUTPUT"
          images=$(sed -n 's/^images=//p' "$GITHUB_OUTPUT" | tail -n 1)
          printf '## Image PR route\n\n| route | images |\n|---|---|\n| %s | %s |\n' \
            "$effective_route" "$images" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-plan
          path: ${{ runner.temp }}/ci-plan
          if-no-files-found: warn
          retention-days: 7

  cpu-tests:
    name: ${{ matrix.display_name }}
    needs: plan
    if: |
      always() && needs.plan.result == 'success' &&
      needs.plan.outputs.change_route == 'mixed' &&
      needs.plan.outputs.cpu_job_count != '0'
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.cpu_jobs) }}
    runs-on: ${{ vars[matrix.runner_variable] || matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            scripts/ci/config/ci.yml
            scripts/ci/config/envs/*.txt

      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
          path: ${{ runner.temp }}/ci-plan

      - name: execute
        env:
          RUNNER_LABEL: ${{ vars[matrix.runner_variable] || matrix.runner }}
          CI_VENV_ROOT: ${{ runner.temp }}/turbo-ci-venv
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/ci-results/${{ matrix.job_id }}"
          mkdir -p "$output"
          python3 -m scripts.ci.execution.consumer.executor \
            --plan "$RUNNER_TEMP/ci-plan/plan.json" \
            --job-id "${{ matrix.job_id }}" \
            --output "$output/job-result.json" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: upload CPU results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-results-${{ matrix.job_id }}
          path: ${{ runner.temp }}/ci-results
          if-no-files-found: warn
          retention-days: 7

  candidates:
    name: Candidate image (${{ matrix.image }})
    needs: [plan, cpu-tests]
    if: |
      always() &&
      needs.plan.result == 'success' &&
      needs.plan.outputs.image_count != '0' &&
      (needs.cpu-tests.result == 'success' || needs.cpu-tests.result == 'skipped')
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(vars.CI_IMAGE_MAX_PARALLEL || '3') }}
      matrix: ${{ fromJSON(needs.plan.outputs.image_jobs) }}
    uses: ./.github/workflows/ascend-image-pipeline.yml
    with:
      image: ${{ matrix.image }}
      target: ${{ matrix.target }}
      checkout_ref: refs/pull/${{ github.event.pull_request.number }}/head
      max_jobs: auto
      use_cache: true
      run_tests: true
    secrets:
      SWR_USERNAME: ${{ secrets.SWR_USERNAME }}
      SWR_PASSWORD: ${{ secrets.SWR_PASSWORD }}

  gate:
    name: Image gate
    needs: [plan, cpu-tests, candidates]
    if: always()
    runs-on: ${{ vars.CI_CPU_RUNNER || 'ubuntu-22.04-arm' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: evaluate image PR pipeline
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          CHANGE_ROUTE: ${{ needs.plan.outputs.change_route }}
          CPU_JOB_COUNT: ${{ needs.plan.outputs.cpu_job_count }}
          CPU_RESULT: ${{ needs.cpu-tests.result }}
          CANDIDATE_RESULT: ${{ needs.candidates.result }}
          IMAGE_COUNT: ${{ needs.plan.outputs.image_count }}
          IMAGES: ${{ needs.plan.outputs.images }}
        run: |
          set -euo pipefail
          failed=0
          require_success() {
            name=$1
            result=$2
            if [ "$result" != success ]; then
              echo "::error::${name} result is ${result}"
              failed=1
            fi
          }
          require_success plan "$PLAN_RESULT"
          if [ "$CHANGE_ROUTE" = no_image ]; then
            if [ "${IMAGE_COUNT:-0}" -ne 0 ]; then
              echo "::error::no-image PR unexpectedly reported affected images"
              failed=1
            fi
            if [ "$CPU_RESULT" != skipped ]; then
              echo "::error::CPU tests must be skipped when no image changed"
              failed=1
            fi
            if [ "$CANDIDATE_RESULT" != skipped ]; then
              echo "::error::candidate builds must be skipped when no image changed"
              failed=1
            fi
          else
            if [ "${IMAGE_COUNT:-0}" -lt 1 ]; then
              echo "::error::no affected image entered the candidate matrix"
              failed=1
            fi
            if [ "$CHANGE_ROUTE" = mixed ]; then
              if [ "${CPU_JOB_COUNT:-0}" -lt 1 ]; then
                echo "::error::mixed PR has no CPU Plan jobs"
                failed=1
              fi
              require_success cpu-tests "$CPU_RESULT"
            elif [ "$CHANGE_ROUTE" = image_only ]; then
              if [ "$CPU_RESULT" != skipped ]; then
                echo "::error::CPU tests must be skipped for image-only PRs"
                failed=1
              fi
            else
              echo "::error::Plan did not report no_image, image_only or mixed"
              failed=1
            fi
            require_success candidates "$CANDIDATE_RESULT"
          fi
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "image PR pipeline passed for $CHANGE_ROUTE: $IMAGES" >> "$GITHUB_STEP_SUMMARY"

      - name: download CPU Plan
        if: always() && needs.plan.outputs.change_route == 'mixed'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ci-plan
          path: ${{ runner.temp }}/ci-plan

      - name: download CPU results
        if: always() && needs.plan.outputs.change_route == 'mixed'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: ci-results-*
          path: ${{ runner.temp }}/ci-results

      - name: judge CPU Plan results
        if: always() && needs.plan.outputs.change_route == 'mixed'
        env:
          PLAN: ${{ runner.temp }}/ci-plan/plan.json
          RESULTS: ${{ runner.temp }}/ci-results
          DECISION: ${{ runner.temp }}/ci-decision/decision.json
        run: |
          set -uo pipefail
          mkdir -p "$RESULTS" "$(dirname "$DECISION")"
          if [ ! -f "$PLAN" ]; then
            echo "::error::missing CPU Plan artifact"
            exit 2
          fi
          python3 -m scripts.ci.execution.consumer.gate \
            --plan "$PLAN" \
            --results "$RESULTS" \
            --output "$DECISION" \
            --summary "$GITHUB_STEP_SUMMARY"
