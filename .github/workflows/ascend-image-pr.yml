name: Ascend-Image-PR
run-name: Ascend-Image-PR ${{ format('#{0}', github.event.pull_request.number) }}

# Dockerfile PR validation. The route job combines PR trust, change routing and
# image selection, then each affected image runs one complete pipeline:
#   build candidate -> smoke -> candidate tests
#
# Different images run in parallel. A global build/smoke/test stage barrier is
# intentionally absent, so a fast image never waits for an unrelated slow one.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    branches: [main, ci/image-pr-base]
    paths:
      - 'docker/**/Dockerfile*'

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: image-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  route:
    name: Ascend-Image-Route
    runs-on: ${{ vars.CI_CPU_RUNNER || 'ubuntu-22.04-arm' }}
    timeout-minutes: 10
    outputs:
      change_route: ${{ steps.route.outputs.change_route }}
      cpu_needed: ${{ steps.route.outputs.cpu_needed }}
      matrix: ${{ steps.route.outputs.matrix }}
      image_count: ${{ steps.route.outputs.image_count }}
      images: ${{ steps.route.outputs.images }}
    steps:
      - name: require approval label for fork PRs
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'image-ci/run') }}
        run: |
          set -euo pipefail
          if [ "$HEAD_REPOSITORY" = "$BASE_REPOSITORY" ]; then
            echo "same-repository PR; image candidate validation is allowed"
            exit 0
          fi
          if [ "$HAS_LABEL" = true ]; then
            echo "fork PR approved with image-ci/run"
            exit 0
          fi
          echo "::error::fork image PR requires the 'image-ci/run' label after maintainer review"
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install CI dependencies
        run: python3 -m pip install --quiet --disable-pip-version-check -r requirements-lint.txt

      - name: route changes and select affected images
        id: route
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          changed="$RUNNER_TEMP/ci-changed-files.txt"
          git diff --name-only --no-renames "$BASE_SHA...HEAD" > "$changed"
          route_output=$(python3 -m scripts.ci.routing.change_router --changed-files "$changed")
          change_route=${route_output#change_route=}
          cpu_needed=false
          if [ "$change_route" = mixed ]; then
            cpu_needed=true
          elif [ "$change_route" != image_only ]; then
            echo "::error::expected image_only or mixed Dockerfile PR; got $route_output"
            exit 1
          fi
          matrix="$RUNNER_TEMP/image-matrix.json"
          python3 -m scripts.ci.image.selection \
            --root "$GITHUB_WORKSPACE" \
            --changed-files "$changed" \
            --output "$matrix" \
            --github-output "$GITHUB_OUTPUT"
          echo "change_route=$change_route" >> "$GITHUB_OUTPUT"
          echo "cpu_needed=$cpu_needed" >> "$GITHUB_OUTPUT"
          images=$(python3 -c \
            'import json,sys; print(",".join(i["image"] for i in json.load(open(sys.argv[1]))["include"]))' \
            "$matrix")
          {
            echo '## Image PR route'
            echo ''
            echo '| field | value |'
            echo '|---|---|'
            echo "| route | \`${change_route}\` |"
            echo "| CPU preflight | \`${cpu_needed}\` |"
            echo "| images | \`${images}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  cpu:
    name: Ascend-Image-CPU-Preflight
    needs: route
    if: |
      needs.route.result == 'success' &&
      needs.route.outputs.cpu_needed == 'true'
    uses: ./.github/workflows/ascend-pr.yml
    with:
      mode: pr
      scope: pull_request
      targets: cpu
      checkout_ref: refs/pull/${{ github.event.pull_request.number }}/head

  candidates:
    name: Ascend-Image-Candidate (${{ matrix.image }})
    needs: [route, cpu]
    if: |
      always() &&
      needs.route.result == 'success' &&
      needs.route.outputs.image_count != '0' &&
      (needs.cpu.result == 'success' || needs.cpu.result == 'skipped')
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(vars.CI_IMAGE_MAX_PARALLEL || '2') }}
      matrix: ${{ fromJSON(needs.route.outputs.matrix) }}
    uses: ./.github/workflows/ascend-image-pipeline.yml
    with:
      image: ${{ matrix.image }}
      image_mode: build_if_missing
      target: ${{ matrix.target }}
      device: ${{ matrix.device }}
      smoke_runner_variable: ${{ matrix.smoke_runner_variable }}
      smoke_runner: ${{ matrix.smoke_runner }}
      checkout_ref: refs/pull/${{ github.event.pull_request.number }}/head
      max_jobs: auto
      use_cache: true
    secrets:
      SWR_USERNAME: ${{ secrets.SWR_USERNAME }}
      SWR_PASSWORD: ${{ secrets.SWR_PASSWORD }}

  gate:
    name: Ascend-Image-PR-Gate
    needs: [route, cpu, candidates]
    if: always()
    runs-on: ${{ vars.CI_CPU_RUNNER || 'ubuntu-22.04-arm' }}
    timeout-minutes: 5
    steps:
      - name: evaluate image PR pipeline
        env:
          ROUTE_RESULT: ${{ needs.route.result }}
          CHANGE_ROUTE: ${{ needs.route.outputs.change_route }}
          CPU_NEEDED: ${{ needs.route.outputs.cpu_needed }}
          CPU_RESULT: ${{ needs.cpu.result }}
          CANDIDATE_RESULT: ${{ needs.candidates.result }}
          IMAGE_COUNT: ${{ needs.route.outputs.image_count }}
          IMAGES: ${{ needs.route.outputs.images }}
        run: |
          set -euo pipefail
          failed=0
          require_success() {
            name=$1
            result=$2
            if [ "$result" != success ]; then
              echo "::error::${name} result is ${result}"
              failed=1
            fi
          }
          require_success route "$ROUTE_RESULT"
          if [ "${IMAGE_COUNT:-0}" -lt 1 ]; then
            echo "::error::no affected image entered the candidate matrix"
            failed=1
          fi
          if [ "$CPU_NEEDED" = true ]; then
            require_success cpu "$CPU_RESULT"
          elif [ "$CPU_NEEDED" = false ]; then
            if [ "$CPU_RESULT" != skipped ]; then
              echo "::error::cpu preflight must be skipped for Dockerfile-only PRs"
              failed=1
            fi
          else
            echo "::error::route did not report cpu_needed"
            failed=1
          fi
          require_success candidates "$CANDIDATE_RESULT"
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "image PR pipeline passed for $CHANGE_ROUTE: $IMAGES" >> "$GITHUB_STEP_SUMMARY"
