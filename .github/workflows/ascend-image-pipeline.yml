name: Ascend Candidate
run-name: Candidate ${{ inputs.image }}

# One logical image's candidate pipeline. The parent workflow expands this as a
# matrix so different Dockerfiles run independently without global barriers.
# Manual dispatch runs the same build path without the parent image PR workflow.

on:
  workflow_call:
    inputs:
      image:
        description: 'Logical image name from resources.images'
        required: true
        type: string
      target:
        description: 'Target slice used by candidate tests; required when run_tests is true'
        required: false
        default: ''
        type: string
      image_plan:
        description: 'Precomputed compact ImagePlan JSON from the image PR Plan'
        required: false
        default: ''
        type: string
      content_tag:
        description: 'Precomputed content tag used for build concurrency'
        required: false
        default: ''
        type: string
      checkout_ref:
        description: 'Git ref under test; empty uses the calling workflow SHA'
        required: false
        default: ''
        type: string
      max_jobs:
        description: 'MAX_JOBS passed to the image builder'
        required: false
        default: 'auto'
        type: string
      use_cache:
        description: 'Use the GitHub Actions build cache'
        required: false
        default: true
        type: boolean
      runner:
        description: 'Optional build runner label; empty uses CI_IMAGE_RUNNER'
        required: false
        default: ''
        type: string
      run_tests:
        description: 'Run candidate tests after building or reusing the image'
        required: false
        default: true
        type: boolean
    secrets:
      SWR_USERNAME:
        required: false
      SWR_PASSWORD:
        required: false

  workflow_dispatch:
    inputs:
      image:
        description: 'Logical image name'
        required: true
        default: 'npu-default'
        type: string
      target:
        description: 'Target slice used by tests; required when run_tests is true'
        required: false
        default: ''
        type: string
      checkout_ref:
        description: 'Git ref to build; empty uses the dispatched SHA'
        required: false
        default: ''
        type: string
      max_jobs:
        description: 'MAX_JOBS passed to the image builder'
        required: false
        default: 'auto'
        type: string
      use_cache:
        description: 'Use the GitHub Actions build cache'
        required: false
        default: true
        type: boolean
      runner:
        description: 'Optional build runner label; empty uses CI_IMAGE_RUNNER'
        required: false
        default: ''
        type: string
      run_tests:
        description: 'Run candidate tests after building or reusing the image'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.runner || vars.CI_IMAGE_RUNNER || vars.CI_CPU_RUNNER || 'ubuntu-22.04-arm' }}
    timeout-minutes: 350
    concurrency:
      group: image-${{ inputs.content_tag || inputs.image }}
      cancel-in-progress: false
    outputs:
      ref: ${{ steps.result.outputs.ref }}
      digest: ${{ steps.result.outputs.digest }}
      content_tag: ${{ steps.result.outputs.content_tag }}
      built: ${{ steps.result.outputs.built }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install CI dependencies
        run: python3 -m pip install --quiet --disable-pip-version-check -r requirements-lint.txt

      - name: check build environment
        run: python3 -m scripts.ci.image env

      - name: log in to SWR
        env:
          SWR_USER: ${{ secrets.SWR_USERNAME }}
          SWR_PASS: ${{ secrets.SWR_PASSWORD }}
          REGISTRY: ${{ vars.SWR_REGISTRY || 'swr.cn-north-12.myhuaweicloud.com' }}
        run: |
          set -euo pipefail
          : "${SWR_USER:?SWR_USERNAME is required for image builds}"
          : "${SWR_PASS:?SWR_PASSWORD is required for image builds}"
          printf '%s' "$SWR_PASS" | docker login "$REGISTRY" -u "$SWR_USER" --password-stdin

      - name: create buildx builder
        id: builder
        run: |
          set -euo pipefail
          name="imageci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if docker buildx create --name "$name" --driver docker-container --use; then
            docker buildx inspect --bootstrap >/dev/null
            echo "name=$name" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::docker-container builder failed; falling back to the default builder"
            echo "name=" >> "$GITHUB_OUTPUT"
          fi

      - name: build image
        id: result
        env:
          IMAGE: ${{ inputs.image }}
          IMAGE_PLAN: ${{ inputs.image_plan }}
          BUILDER: ${{ steps.builder.outputs.name }}
          MAX_JOBS: ${{ inputs.max_jobs }}
          USE_CACHE: ${{ inputs.use_cache }}
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/image-result.json"
          common=(--image "$IMAGE" --output "$result")
          build=(python3 -m scripts.ci.image build "${common[@]}" --policy build_if_missing)
          if [ -n "$IMAGE_PLAN" ]; then
            printf '%s' "$IMAGE_PLAN" > "$RUNNER_TEMP/image-plan.json"
            build+=(--plan-file "$RUNNER_TEMP/image-plan.json")
          fi
          if [ -n "${BUILDER:-}" ]; then build+=(--builder "$BUILDER"); fi
          if [ -n "${MAX_JOBS:-}" ]; then build+=(--max-jobs "$MAX_JOBS"); fi
          if [ "${USE_CACHE:-true}" != true ]; then build+=(--no-cache); fi
          "${build[@]}"

      - name: upload build log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: image-build-log-${{ inputs.image }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: summary
        if: always()
        env:
          CONTENT_TAG: ${{ steps.result.outputs.content_tag }}
          DIGEST: ${{ steps.result.outputs.digest }}
          BUILT: ${{ steps.result.outputs.built }}
        run: |
          {
            echo '## Image CI'
            echo ''
            echo '| field | value |'
            echo '|---|---|'
            echo "| content tag | \`${CONTENT_TAG:-missing}\` |"
            echo "| digest | \`${DIGEST:-missing}\` |"
            echo "| built | \`${BUILT:-unknown}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: cleanup
        if: always() && steps.builder.outputs.name != ''
        continue-on-error: true
        env:
          BUILDER: ${{ steps.builder.outputs.name }}
        run: docker buildx rm "$BUILDER"

  tests:
    name: Test
    if: inputs.run_tests
    needs: build
    uses: ./.github/workflows/ascend-pr.yml
    with:
      mode: pr
      scope: pull_request
      targets: ${{ inputs.target }}
      checkout_ref: ${{ inputs.checkout_ref }}
      image_name: ${{ inputs.image }}
      image_ref: ${{ needs.build.outputs.ref }}
